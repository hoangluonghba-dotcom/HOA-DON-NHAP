<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>NAM TIẾN - App Tổng Hợp</title>

<!-- Icon khi thêm vào màn hình chính điện thoại -->
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon-180.png">
<link rel="apple-touch-icon" sizes="167x167" href="icons/apple-touch-icon-167.png">
<link rel="apple-touch-icon" sizes="152x152" href="icons/apple-touch-icon-152.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Nam Tiến">
<meta name="theme-color" content="#0f1f5c">

<style>
* { box-sizing: border-box; margin:0; padding:0; }
body { font-family: -apple-system, sans-serif; height:100vh; display:flex; flex-direction:column; }
#frameWrap { flex:1; position:relative; }
iframe { position:absolute; top:0; left:0; width:100%; height:100%; border:none; display:none; }
iframe.active { display:block; }
#tabBar { display:flex; background:#0f1f5c; padding-bottom: env(safe-area-inset-bottom, 0px); }
.tab { flex:1; text-align:center; padding:12px 4px; color:#fff; font-size:12px; font-weight:700; cursor:pointer; opacity:0.6; }
.tab.active { opacity:1; border-top:3px solid #f7941d; }
</style>
</head>
<body>
<div id="frameWrap">
<iframe id="f1" class="active" src="https://script.google.com/macros/s/AKfycbwPtQ4tvkQbxoVuyX1nSJJIZWU8aHS8jEkBV5qdr8_6ArAL9eQAb2609AUps0ydUg_Gdw/exec"></iframe>
<iframe id="f2" src="https://script.google.com/macros/s/AKfycbyNEVN12cJ4Dbqm9fTxzVxxKGNRRx1d6trImhoq8sG7gtuHNJ8ByXE26tT-VGJx0lvEqw/exec"></iframe>
<iframe id="f3" src="https://script.google.com/macros/s/AKfycbx3hYgvOz31LSAuih7gWl8rMfkQYccGALL_ftXLKO0J10iGJA5AdqZ9hZ9Ab5AUVVTolQ/exec"></iframe>
<iframe id="f4" src="https://script.google.com/macros/s/AKfycbxB7pDBTg5Q8hULilXgrptpbL_s_JPguN2S2UBeDyeL_4d0d7_iQdBWhvBXW1bfgQce6w/exec"></iframe>
</div>
<div id="tabBar">
<div class="tab active" onclick="chuyen(1,this)">🧾 Hoá đơn</div>
<div class="tab" onclick="chuyen(2,this)">⚡ Check giá</div>
<div class="tab" onclick="chuyen(3,this)">💰 Chi phí</div>
<div class="tab" onclick="chuyen(4,this)">📦 XNK 2026</div>
</div>
<script>
function chuyen(n, el) {
document.querySelectorAll('iframe').forEach(f => f.classList.remove('active'));
document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
document.getElementById('f'+n).classList.add('active');
el.classList.add('active');
    }
</script>
</body>
</html>
