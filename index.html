<!DOCTYPE html> 
<html>
<head>
  <base target="_top">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Nam Tiến - Tra cứu & Lập hoá đơn nháp</title>
  <style>
    :root {
      --brand-navy: #0f1f5c;
      --brand-navy2: #1a2f8f;
      --brand-blue: #1a73e8;
      --brand-orange: #f7941d;
      --brand-orange2: #ffb347;
      --brand-red: #e53935;
      --bg: #f2f4f8;
      --card: #ffffff;
      --text: #1a1d29;
      --text-muted: #6b7280;
      --border: #e8eaf0;
      --radius: 16px;
      --radius-sm: 10px;
      --shadow: 0 2px 10px rgba(15,31,92,0.06);
      --shadow-lg: 0 8px 24px rgba(15,31,92,0.12);
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html { scroll-behavior: smooth; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-size: 15px;
      -webkit-font-smoothing: antialiased;
    }

    /* ===== HEADER hiện đại: logo + tên thương hiệu, gradient theo màu logo ===== */
    header {
      background: linear-gradient(135deg, var(--brand-navy) 0%, var(--brand-navy2) 55%, #223aa8 100%);
      color: #fff;
      padding: 14px 16px 16px;
      position: sticky;
      top: 0;
      z-index: 20;
      box-shadow: 0 4px 16px rgba(15,31,92,0.25);
    }
    .header-top {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .header-top img.logo {
      width: 46px;
      height: 46px;
      object-fit: contain;
      filter: drop-shadow(0 2px 5px rgba(0,0,0,0.35));
      flex-shrink: 0;
    }
    .header-brand {
      display: flex;
      flex-direction: column;
      line-height: 1.15;
    }
    .header-brand .name {
      font-weight: 800;
      font-size: 17px;
      letter-spacing: 0.5px;
    }
    .header-brand .tagline {
      font-size: 10.5px;
      font-weight: 600;
      color: var(--brand-orange2);
      letter-spacing: 0.8px;
      text-transform: uppercase;
    }
    .header-app-title {
      font-size: 12.5px;
      font-weight: 500;
      color: rgba(255,255,255,0.75);
      margin-left: auto;
      text-align: right;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    #syncIndicator {
      display: none;
      font-size: 11px;
      font-weight: 600;
      color: var(--brand-orange2);
      align-items: center;
      gap: 4px;
    }
    #syncIndicator.show { display: inline-flex; }
    #syncIndicator .dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--brand-orange2);
      animation: pulse 1s infinite;
    }

    .container { padding: 12px; max-width: 720px; margin: 0 auto; }

    .card {
      background: var(--card);
      border-radius: var(--radius);
      padding: 14px;
      margin-bottom: 12px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
    }

    label { font-size: 12.5px; font-weight: 600; color: var(--text-muted); display: block; margin-bottom: 6px; }
    select, input[type="text"], input[type="number"] {
      width: 100%;
      padding: 11px 12px;
      border: 1.5px solid var(--border);
      border-radius: var(--radius-sm);
      font-size: 15px;
      margin-bottom: 10px;
      background: #fafbfc;
      color: var(--text);
      transition: border-color .15s ease, background .15s ease;
      font-family: inherit;
    }
    select:focus, input:focus {
      outline: none;
      border-color: var(--brand-blue);
      background: #fff;
    }

    button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: var(--radius-sm);
      font-size: 14.5px;
      font-weight: 700;
      cursor: pointer;
      transition: transform .08s ease, opacity .15s ease, box-shadow .15s ease;
      font-family: inherit;
    }
    button:active { transform: scale(0.97); }
    button:disabled { opacity: 0.6; cursor: default; transform: none; }

    .btn-primary { background: linear-gradient(135deg, var(--brand-blue), #1558b0); color: #fff; box-shadow: 0 3px 10px rgba(26,115,232,0.3); }
    .btn-secondary { background: linear-gradient(135deg, #34a853, #26843f); color: #fff; margin-top: 10px; box-shadow: 0 3px 10px rgba(52,168,83,0.3); }
    .btn-sync { background: linear-gradient(135deg, var(--brand-orange), #e07c00); color: #fff; box-shadow: 0 3px 10px rgba(247,148,29,0.3); }
    .btn-ghost { background: #f3f4f8; color: var(--text); box-shadow: none; }
    .btn-warn { background: linear-gradient(135deg, #e53935, #b71c1c); color: #fff; box-shadow: 0 3px 10px rgba(229,57,53,0.3); }

    .tabs { display: flex; margin-bottom: 12px; gap: 6px; background: #eceef4; padding: 4px; border-radius: 12px; flex-wrap: wrap; }
    .tab {
      flex: 1;
      min-width: 70px;
      text-align: center;
      padding: 9px 4px;
      border-radius: 9px;
      font-weight: 700;
      font-size: 12px;
      color: var(--text-muted);
      cursor: pointer;
      transition: all .15s ease;
    }
    .tab.active {
      background: linear-gradient(135deg, var(--brand-navy), var(--brand-navy2));
      color: #fff;
      box-shadow: 0 2px 8px rgba(15,31,92,0.25);
    }

    .item {
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 12px;
      margin-bottom: 8px;
      background: #fff;
      animation: fadeIn .25s ease;
    }
    .item-title { font-weight: 700; margin-bottom: 8px; font-size: 14.5px; line-height: 1.35; }
    .item-row { display: flex; justify-content: space-between; font-size: 12.5px; color: var(--text-muted); padding: 2px 0; gap: 8px; }
    .item-row span:last-child { text-align: right; font-weight: 600; color: var(--text); }
    .qty-box { display: flex; align-items: center; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
    .qty-box input, .qty-box select { margin-bottom: 0; width: 74px; text-align: center; }

    .badge {
      display: inline-block;
      font-size: 10.5px;
      font-weight: 700;
      padding: 3px 9px;
      border-radius: 20px;
      margin-left: 6px;
    }
    .badge-white { background: #e8f0fe; color: var(--brand-blue); }
    .badge-done { background: #fce8e6; color: #c5221f; }
    .badge-vat { background: #fef3e2; color: #b06000; }
    .badge-old1 { background: #fff3e0; color: #b06000; }
    .badge-old2 { background: #fce8e6; color: #c5221f; }
    .badge-chiphi { background: #e0e7ff; color: #3730a3; }
    .badge-lienam { background: #eafaf1; color: #0f7b3f; }

    .empty-msg { text-align: center; color: var(--text-muted); padding: 32px 16px; font-size: 14px; }
    .empty-msg .icon { font-size: 32px; display: block; margin-bottom: 8px; opacity: 0.5; }

    /* ===== Skeleton loading - cảm giác nhanh, chuyên nghiệp thay vì chữ "Đang tải..." trơ ===== */
    .skeleton-item {
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 12px;
      margin-bottom: 8px;
      background: #fff;
    }
    .skel-line {
      height: 12px;
      border-radius: 6px;
      background: linear-gradient(90deg, #eceef2 25%, #f6f7fa 37%, #eceef2 63%);
      background-size: 400% 100%;
      animation: shimmer 1.4s ease infinite;
      margin-bottom: 8px;
    }
    .skel-line.w60 { width: 60%; }
    .skel-line.w40 { width: 40%; }
    .skel-line.w90 { width: 90%; }
    @keyframes shimmer { 0% { background-position: 100% 0; } 100% { background-position: -100% 0; } }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes pulse { 0% { opacity: 0.35; } 50% { opacity: 1; } 100% { opacity: 0.35; } }

    .summary-bar {
      position: sticky;
      bottom: 0;
      background: #fff;
      padding: 14px;
      box-shadow: 0 -4px 16px rgba(15,31,92,0.12);
      display: none;
      border-radius: 16px 16px 0 0;
      border-top: 1px solid var(--border);
    }
    .summary-bar.show { display: block; animation: fadeIn .2s ease; }

    .invoice-card {
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 13px;
      margin-bottom: 8px;
      background: #fff;
      transition: box-shadow .15s ease, border-color .15s ease;
      animation: fadeIn .25s ease;
    }
    .invoice-card:active { box-shadow: var(--shadow-lg); border-color: var(--brand-blue); }
    .invoice-details { animation: fadeIn .2s ease; }

    #syncTime { font-size: 12px; color: var(--text-muted); text-align: center; margin-top: 8px; font-weight: 500; }

    /* ===== Giỏ hàng đã chọn (hiển thị để sửa SL/giá/VAT hoặc xoá) ===== */
    .cart-row {
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 10px;
      margin-bottom: 6px;
      background: #f9fafc;
    }
    .cart-row-title {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 8px;
      font-weight: 700;
      font-size: 13.5px;
      margin-bottom: 8px;
    }
    .cart-row-title .x-remove {
      cursor: pointer;
      color: #c5221f;
      font-weight: 800;
      flex-shrink: 0;
      padding: 0 4px;
    }
    .cart-row-fields { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .cart-row-fields label { margin: 0; font-size: 11.5px; white-space: nowrap; }
    .cart-row-fields input, .cart-row-fields select {
      margin-bottom: 0;
      padding: 7px 8px;
      font-size: 13px;
    }

    /* ===== Modal xem hoá đơn tạm để chụp màn hình (không lưu gì cả) ===== */
    #modalHoaDon {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(15,20,40,0.65);
      z-index: 200;
      padding: 10px;
      overflow-y: auto;
    }
    #modalHoaDon .modal-box {
      background: #fff;
      border-radius: 14px;
      max-width: 560px;
      margin: 14px auto;
      padding: 16px 12px;
      animation: fadeIn .2s ease;
    }
    #modalHoaDon .modal-close {
      text-align: right;
      margin-bottom: 6px;
    }
    #modalHoaDon .modal-close span {
      cursor: pointer;
      font-weight: 800;
      font-size: 15px;
      color: var(--text-muted);
      background: #f3f4f8;
      padding: 6px 12px;
      border-radius: 20px;
      display: inline-block;
    }
    /* ===== BẢNG mặt hàng trong hoá đơn nháp tạm - dạng BẢNG CÓ KẺ Ô
       (table-layout: fixed + word-break) để chữ LUÔN NẰM GỌN TRONG Ô,
       tự động xuống dòng khi mô tả dài, KHÔNG bao giờ tràn ra ngoài
       màn hình hay bị cắt mất chữ, dù trên điện thoại nhỏ. ===== */
    .hd-table-wrap { margin-top: 10px; }
    .hd-table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
      font-size: 11.5px;
    }
    .hd-table th, .hd-table td {
      border: 1px solid var(--border);
      padding: 6px 5px;
      text-align: left;
      word-break: break-word;
      overflow-wrap: break-word;
      white-space: normal;
      vertical-align: top;
      line-height: 1.35;
    }
    .hd-table thead th {
      background: #f0f2f8;
      font-weight: 700;
      color: var(--brand-navy2);
      font-size: 11px;
    }
    .hd-table td.so { text-align: right; font-variant-numeric: tabular-nums; }
    .hd-table td.center { text-align: center; }
    .hd-table tbody tr:nth-child(even) { background: #fbfbfd; }
    .hd-table tfoot td { font-weight: 800; background: #fdf3f2; color: #c5221f; }

    /* ===== Panel cảnh báo tồn kho lâu ngày ===== */
    .old-stock-row {
      border: 1px solid var(--border);
      border-left: 4px solid var(--brand-orange);
      border-radius: 8px;
      padding: 9px 11px;
      margin-bottom: 7px;
      background: #fffaf3;
      font-size: 12.5px;
    }
    .old-stock-row.critical { border-left-color: #c5221f; background: #fdf3f2; }
    .old-stock-row .title { font-weight: 700; margin-bottom: 4px; }
    .old-stock-row .meta { color: var(--text-muted); display: flex; flex-wrap: wrap; gap: 4px 12px; }
  </style>
</head>

  <script>
    const API_URL = 'https://script.google.com/macros/s/AKfycbwPtQ4tvkQbxoVuyX1nSJJIZWU8aHS8jEkBV5qdr8_6ArAL9eQAb2609AUps0ydUg_Gdw/exec';
function taoGasRun_(apiUrl) {
  function build(state) {
    return new Proxy({}, {
      get(_, prop) {
        if (prop === 'withSuccessHandler') return (fn) => build({ ...state, onSuccess: fn });
        if (prop === 'withFailureHandler') return (fn) => build({ ...state, onFailure: fn });
        return (...args) => {
          return (...args) => {
          const url = apiUrl + '?fn=' + encodeURIComponent(prop) + '&args=' + encodeURIComponent(JSON.stringify(args));
          fetch(url)
            .then(r => r.json())
            .then(res => {
              if (res.error) (state.onFailure || (()=>{}))({ message: res.error });
              else (state.onSuccess || (()=>{}))(res.result);
            })
            .catch(err => (state.onFailure || (()=>{}))(err));
        };
      }
    });
  }
  return build({});
}
window.google = { script: { run: taoGasRun_(API_URL) } };

    // dùng để hiển thị (hiển thị vẫn dùng giá trị gốc sp.soHDXK / sp.soHDNhap).
    function chuanHoaSoHDGop(s) {
      if (s === null || s === undefined) return "";
      let str = String(s).trim().toLowerCase()
        .replace(/hđ|hd/g, "")
        .replace(/\s+/g, "");
      str = str.replace(/^0+(?=\d)/, "");
      return str;

    // NÂNG CẤP (18/07) - TỐC ĐỘ: áp dụng mô hình "Stale-While-Revalidate".

    // thị NGAY LẬP TỨC (gần như 0 giây) thay vì bắt người dùng chờ gọi Google
    // Sheet. Sau đó mới âm thầm gọi server làm mới dữ liệu ở NỀN (không chặn
    // giao diện). Chỉ khi sheet CHƯA từng có cache (lần đầu) mới phải hiện
    // skeleton chờ tải thật.
    window.addEventListener('load', function() {
      try {
        var sel = document.getElementById('sheetSelect');
        sel.innerHTML = '';
        DANH_SACH_NAM.forEach(function(ten) {
          var opt = document.createElement('option');
          opt.value = ten; opt.textContent = ten;
          sel.appendChild(opt);
        });
        sel.value = '2026';

        const cacheKey = "cache_data_2026";
        const rawCache = localStorage.getItem(cacheKey);
        if (rawCache) {
          apDungCache_('2026', rawCache);
          dongBoMotSheetTuServer('2026', false, true); // làm mới ngầm, không chặn UI
        } else {
          dongBoMotSheetTuServer('2026', true, false); // lần đầu, chưa có gì để hiện tạm -> chờ thật
        }
      } catch(e) {
        document.getElementById('ketQua').innerHTML = '<div class="empty-msg"><span class="icon">⚠️</span>Lỗi khởi tạo: ' + e.message + '</div>';
      }
    });

    function chuyenTab(tab) {
      tabHienTai = tab;
      document.getElementById('tabChuaXuat').classList.toggle('active', tab === 'chuaXuat');
      document.getElementById('tabDaXuat').classList.toggle('active', tab === 'daXuat');
      document.getElementById('tabChiPhi').classList.toggle('active', tab === 'chiPhi');
      document.getElementById('tabNcc').classList.toggle('active', tab === 'ncc');
      render();
    }

    /**
     * Được gọi khi người dùng đổi dropdown sang 1 sheet năm khác (2025/2024).
     * - Có cache -> hiện NGAY LẬP TỨC, đồng thời âm thầm làm mới ở nền.
     * - Chưa có cache (lần đầu bấm qua tab này) -> hiện skeleton, gọi thật.
     */
    function chonSheet() {
      const tenSheet = document.getElementById('sheetSelect').value;
      const cacheKey = "cache_data_" + tenSheet;
      const rawCache = localStorage.getItem(cacheKey);

      if (rawCache) {
        apDungCache_(tenSheet, rawCache);
        dongBoMotSheetTuServer(tenSheet, false, true); // làm mới ngầm
      } else {
        dongBoMotSheetTuServer(tenSheet, true, false); // lần đầu, chờ thật
      }
    }

    function apDungCache_(tenSheet, rawCache) {
      try {
        const cacheObj = JSON.parse(rawCache);
        const formattedTime = new Date(cacheObj.timestamp).toLocaleString('vi-VN', { hour: '2-digit', minute: '2-digit', day: '2-digit', month: '2-digit' });
        document.getElementById('syncTime').innerHTML = '✅ [' + tenSheet + '] Đã đồng bộ lúc: <b>' + formattedTime + '</b>';

        const tuKhoa = document.getElementById('tuKhoa').value;
        ketQuaHienTai = locDuLieuCucBo(cacheObj.data, tuKhoa);
        render();
      } catch (e) {
        dongBoMotSheetTuServer(tenSheet, true, false);
      }
    }

    /**
     * Gọi server lấy dữ liệu THẬT của ĐÚNG 1 sheet.
     * @param hienThiLoading  true = hiển thị skeleton chờ (dùng khi CHƯA có cache / bấm nút Đồng bộ thủ công)
     * @param imLang          true = chạy NỀN, chỉ hiện chấm nhỏ "Đang đồng bộ" ở header, không chặn UI đang xem
     * @param maHDDangSuaParam (tuỳ chọn) Mã HĐ nháp đang sửa - truyền xuống server để loại trừ chính hoá
     *        đơn này khỏi phép tính tồn kho đã giữ chỗ (cho phép tăng số lượng khi sửa)
     */
    function dongBoMotSheetTuServer(tenSheet, hienThiLoading, imLang, maHDDangSuaParam) {
      if (DANH_SACH_NAM.indexOf(tenSheet) === -1) {
        document.getElementById('ketQua').innerHTML = '<div class="empty-msg"><span class="icon">⚠️</span>Sheet không hợp lệ: ' + tenSheet + '</div>';
        return;
      }

      const btn = document.getElementById('btnDongBo');
      const originalText = btn.innerHTML;
      const syncIndicator = document.getElementById('syncIndicator');

      if (imLang) {
        syncIndicator.classList.add('show');
      } else {
        btn.disabled = true;
        btn.innerHTML = '🔄 Đang tải...';
        if (hienThiLoading) {
          document.getElementById('ketQua').innerHTML = SKELETON_HTML;
          document.getElementById('syncTime').innerHTML = '⏳ Đang tải dữ liệu sheet ' + tenSheet + '...';
        }
      }

      google.script.run.withSuccessHandler(function (kq) {
        syncIndicator.classList.remove('show');
        btn.disabled = false;
        btn.innerHTML = originalText;

        if (kq.error) {
          if (!imLang) {
            document.getElementById('ketQua').innerHTML = '<div class="empty-msg"><span class="icon">⚠️</span>Lỗi đồng bộ: ' + kq.error + '</div>';
          }
          document.getElementById('syncTime').innerHTML = '⚠️ Đồng bộ thất bại';
          return;
        }

        const now = Date.now();
        const cacheObj = { timestamp: now, data: kq.data };
        // Khi đang sửa 1 hoá đơn (có maHDDangSuaParam), dữ liệu đã loại trừ
        // chính hoá đơn đó -> KHÔNG lưu đè vào cache chung để tránh sai lệch
        // cho những lần xem bình thường sau này.
        if (!maHDDangSuaParam) {
          localStorage.setItem("cache_data_" + tenSheet, JSON.stringify(cacheObj));
        }

        // Chỉ render nếu người dùng vẫn đang chọn đúng sheet này
        if (document.getElementById('sheetSelect').value === tenSheet) {
          const formattedTime = new Date(cacheObj.timestamp).toLocaleString('vi-VN', { hour: '2-digit', minute: '2-digit', day: '2-digit', month: '2-digit' });
          document.getElementById('syncTime').innerHTML = '✅ [' + tenSheet + '] Đã đồng bộ lúc: <b>' + formattedTime + '</b>';
          const tuKhoa = document.getElementById('tuKhoa').value;
          ketQuaHienTai = locDuLieuCucBo(cacheObj.data, tuKhoa);
          render();
        }
      }).withFailureHandler(function (err) {
        syncIndicator.classList.remove('show');
        btn.disabled = false;
        btn.innerHTML = originalText;
        if (!imLang) {
          document.getElementById('ketQua').innerHTML = '<div class="empty-msg"><span class="icon">⚠️</span>Lỗi: ' + err.message + '</div>';
        }
        document.getElementById('syncTime').innerHTML = '⚠️ Đồng bộ thất bại';
      }).dongBoMotSheet(tenSheet, maHDDangSuaParam || null);
    }

    /**
     * Nút "🔄 Đồng bộ" = người dùng CHỦ ĐỘNG yêu cầu làm mới ngay sheet đang
     * chọn -> hiển thị skeleton chờ (không phải chạy ngầm) để họ biết chắc
     * đã có dữ liệu mới nhất.
     */
    function dongBoDuLieu() {
      const tenSheet = document.getElementById('sheetSelect').value;
      dongBoMotSheetTuServer(tenSheet, true, false, maHDDangSua);
    }

    // NÂNG CẤP (17/07) #8/#9: cacheObj.data giờ có thêm mảng "chiPhi" (mặt
    // hàng PHÍ/B.L/CƯỚC, tách riêng khỏi hàng hoá) và các item trong
    // "chuaXuat" có thể đã được server tự khấu trừ tồn kho theo lô hàng
    // trùng ở năm khác (xem field daXuatONamKhac / tonKhoGocTruocKhauTruLienNam).
    // Hàm lọc cục bộ này phải lọc đủ cả 3 mảng để không mất dữ liệu khi tìm
    // kiếm bằng dữ liệu cache (không gọi lại server).
    function locDuLieuCucBo(cacheData, tuKhoa) {
      const tk = (tuKhoa || "").trim().toLowerCase();
      if (!tk) return cacheData;

      const chuanHoa = function(s) {
        return String(s || "").toLowerCase().replace(/\s+/g, "").replace(/hđ|hd/g, "");
      };
      const tkChuan = chuanHoa(tk);

      const chuaXuatLoc = [];
      const daXuatLoc = [];
      const chiPhiLoc = [];

      (cacheData.chuaXuat || []).forEach(function (item) {
        const moTa = String(item.moTa || "");
        const soHDNhap = String(item.soHDNhap || "");
        const soHDXuat = String(item.soHDXK || "");

        const matchMoTa = moTa.toLowerCase().indexOf(tk) !== -1;
        const matchHDXuat = soHDXuat !== "" && (soHDXuat.toLowerCase().indexOf(tk) !== -1 || chuanHoa(soHDXuat) === tkChuan);
        const matchHDNhap = soHDNhap !== "" && (soHDNhap.toLowerCase().indexOf(tk) !== -1 || chuanHoa(soHDNhap) === tkChuan);

        if (matchMoTa || matchHDXuat || matchHDNhap) {
          chuaXuatLoc.push(item);
        }
      });

      (cacheData.daXuat || []).forEach(function (item) {
        const moTa = String(item.moTa || "");
        const soHDNhap = String(item.soHDNhap || "");
        const soHDXuat = String(item.soHDXK || "");

        const matchMoTa = moTa.toLowerCase().indexOf(tk) !== -1;
        const matchHDXuat = soHDXuat !== "" && (soHDXuat.toLowerCase().indexOf(tk) !== -1 || chuanHoa(soHDXuat) === tkChuan);
        const matchHDNhap = soHDNhap !== "" && (soHDNhap.toLowerCase().indexOf(tk) !== -1 || chuanHoa(soHDNhap) === tkChuan);

        if (matchMoTa || matchHDXuat || matchHDNhap) {
          if (soHDXuat !== "" && soHDXuat !== "Chưa rõ HĐ" && /\d+/.test(soHDXuat)) {
            daXuatLoc.push(item);
          } else {
            chuaXuatLoc.push(item);
          }
        }
      });

      (cacheData.chiPhi || []).forEach(function (item) {
        const moTa = String(item.moTa || "");
        const soHDNhap = String(item.soHDNhap || "");
        const soHDXuat = String(item.soHDXK || "");

        const matchMoTa = moTa.toLowerCase().indexOf(tk) !== -1;
        const matchHDXuat = soHDXuat !== "" && (soHDXuat.toLowerCase().indexOf(tk) !== -1 || chuanHoa(soHDXuat) === tkChuan);
        const matchHDNhap = soHDNhap !== "" && (soHDNhap.toLowerCase().indexOf(tk) !== -1 || chuanHoa(soHDNhap) === tkChuan);

        if (matchMoTa || matchHDXuat || matchHDNhap) {
          chiPhiLoc.push(item);
        }
      });

      return { chuaXuat: chuaXuatLoc, daXuat: daXuatLoc, chiPhi: chiPhiLoc };
    }

    function timKiem() {
      const tenSheet = document.getElementById('sheetSelect').value;
      const cacheKey = "cache_data_" + tenSheet;
      const rawCache = localStorage.getItem(cacheKey);

      if (rawCache) {
        apDungCache_(tenSheet, rawCache);
      } else {
        dongBoMotSheetTuServer(tenSheet, true, false);
      }
    }

    /**
     * Chuyển chuỗi ngày "dd/MM/yyyy" (hoặc Date-like) thành số NGÀY đã trôi
     * qua tính đến HÔM NAY. Trả về null nếu không đọc được ngày (để không
     * cảnh báo nhầm khi thiếu dữ liệu).
     *
     * SỬA LỖI (18/07): "13/09/25" bị hiểu nhầm thành năm 1925 thay vì 2025
     * -> tồn kho hiện sai "100.9 năm". Nguyên nhân: khi tách "25" ra làm
     * năm rồi gọi new Date(year, month, day) với year trong khoảng 0-99,
     * JavaScript TỰ ĐỘNG cộng thêm 1900 (hành vi mặc định của Date, không
     * phải lỗi cú pháp). Đã sửa: nếu year < 100 thì cộng thêm 2000 TRƯỚC
     * khi tạo Date, để "25" luôn hiểu là 2025 (dữ liệu hệ thống chỉ nằm
     * trong khoảng năm 2000-2099, không có dữ liệu thế kỷ trước).
     */
    function tinhSoNgayTuNgay_(ngayStr) {
      if (!ngayStr) return null;
      let d = null;
      const parts = String(ngayStr).split('/');
      if (parts.length === 3) {
        const day = parseInt(parts[0], 10), month = parseInt(parts[1], 10);
        let year = parseInt(parts[2], 10);
        if (!isNaN(day) && !isNaN(month) && !isNaN(year)) {
          if (year < 100) year += 2000; // "25" -> 2025, "99" -> 2099
          d = new Date(year, month - 1, day);
        }
      }
      if (!d || isNaN(d.getTime())) {
        const d2 = new Date(ngayStr);
        if (!isNaN(d2.getTime())) d = d2;
      }
      if (!d || isNaN(d.getTime())) return null;
      const today = new Date();
      today.setHours(0,0,0,0);
      d.setHours(0,0,0,0);
      return Math.round((today - d) / 86400000);
    }

    /**
     * Trả về badge cảnh báo tồn kho lâu ngày dựa trên số ngày đã tồn:
     * > 730 ngày (2 năm)  -> cảnh báo đỏ NGHIÊM TRỌNG
     * > 365 ngày (1 năm)  -> cảnh báo cam
     * còn lại             -> không cảnh báo (chuỗi rỗng)
     */
    function layBadgeTonLau_(soNgay) {
      if (soNgay === null || soNgay === undefined) return '';
      if (soNgay > 730) {
        return '<span class="badge badge-old2">⚠️ Tồn ' + Math.floor(soNgay / 365) + ' năm ' + (soNgay % 365) + ' ngày</span>';
      }
      if (soNgay > 365) {
        return '<span class="badge badge-old1">⏰ Tồn hơn 1 năm (' + soNgay + ' ngày)</span>';
      }
      return '';
    }

    function render() {
      const el = document.getElementById('ketQua');

      if (tabHienTai === 'chiPhi') {
        renderChiPhi_(el);
        return;
      }

      if (tabHienTai === 'ncc') {
        const combined = [].concat(ketQuaHienTai.chuaXuat || [], ketQuaHienTai.daXuat || []);
        const nccGroup = {};
        combined.forEach(function (item) {
          const nccName = String(item.ncc || "Không rõ NCC").trim();
          const rawSoHD = String(item.soHDNhap || "").trim();
          if (!rawSoHD) return;
          const soHDKey = chuanHoaSoHDGop(rawSoHD);
          if (!soHDKey) return;

          if (!nccGroup[nccName]) {
            nccGroup[nccName] = {};
          }
          if (!nccGroup[nccName][soHDKey]) {
            nccGroup[nccName][soHDKey] = {
              soHD: rawSoHD,
              ngayNK: item.ngayNK,
              tongTien: Number(item.tongTienHDNhap) || 0
            };
          }
        });

        const sortedNcc = Object.keys(nccGroup).sort();
        if (sortedNcc.length === 0) {
          el.innerHTML = '<div style="margin-bottom: 12px; display: flex; gap: 8px;">' +
            '<button class="btn-ghost" onclick="doiChieuGmail()" style="flex: 1;">' +
              '📧 Đối chiếu hoá đơn đầu vào từ Gmail' +
            '</button>' +
          '</div>' +
          '<div class="empty-msg"><span class="icon">📭</span>Không có dữ liệu nhà cung cấp</div>';
          return;
        }

        let htmlNcc = '<div style="margin-bottom: 12px; display: flex; gap: 8px;">' +
          '<button class="btn-ghost" onclick="doiChieuGmail()" style="flex: 1;">' +
            '📧 Đối chiếu hoá đơn đầu vào từ Gmail' +
          '</button>' +
        '</div>';

        sortedNcc.forEach(function (nccName) {
          const invoices = nccGroup[nccName];
          const sortedInvoiceKeys = Object.keys(invoices).sort();

          let invHtml = '';
          sortedInvoiceKeys.forEach(function (soHDKey) {
            const inv = invoices[soHDKey];
            invHtml += '<div style="display: flex; justify-content: space-between; font-size: 13px; background: #f8f9fb; padding: 9px 11px; border-radius: 8px; margin-bottom: 5px; flex-wrap: wrap; gap: 6px;">' +
              '<span>📄 HĐ Số: <b>' + inv.soHD + '</b></span>' +
              '<span>📅 Ngày: ' + (inv.ngayNK || '—') + '</span>' +
              '<span style="color:#34a853; font-weight: 700;">' + formatSo(inv.tongTien) + ' VNĐ</span>' +
            '</div>';
          });

          htmlNcc += '<div class="card" style="padding: 13px; margin-bottom: 10px;">' +
            '<div style="font-weight: 800; font-size: 14.5px; color: var(--brand-navy2); margin-bottom: 9px; border-bottom: 1px solid var(--border); padding-bottom: 7px;">' +
              '🏢 ' + nccName + ' (' + sortedInvoiceKeys.length + ' HĐ)' +
            '</div>' +
            '<div style="display: flex; flex-direction: column; gap: 2px;">' +
              invHtml +
            '</div>' +
          '</div>';
        });

        el.innerHTML = htmlNcc;
        return;
      }

      const list = ketQuaHienTai[tabHienTai] || [];
      if (list.length === 0) {
        el.innerHTML = '<div class="empty-msg"><span class="icon">📭</span>Không có sản phẩm nào</div>';
        return;
      }

      let html = '';
      if (tabHienTai === 'daXuat') {
        const grouped = {};
        list.forEach(function (sp) {
          const rawSoHD = String(sp.soHDXK || "").trim();
          const soHDKey = rawSoHD ? chuanHoaSoHDGop(rawSoHD) : "";
          const key = soHDKey || "chuarohd";

          if (!grouped[key]) {
            grouped[key] = {
              soHD: rawSoHD || "Chưa rõ HĐ",
              ngayXHD: "Chưa rõ",
              kh: "Chưa rõ",
              vatRates: {},
              items: [],
              tongTruocThue: 0,
              tongVat: 0,
              tongSauThue: 0
            };
          }

          if (grouped[key].ngayXHD === "Chưa rõ" && sp.ngayXHD) {
            grouped[key].ngayXHD = sp.ngayXHD;
          }
          if (grouped[key].kh === "Chưa rõ" && sp.kh) {
            grouped[key].kh = sp.kh;
          }

          const qty = Number(sp.slXK) || 0;
          const price = Number(sp.giaXuat) || 0;
          const amountBeforeTax = qty * price;

          let vatPercent = 0;
          if (sp.vat) {
            const parsed = parseFloat(String(sp.vat).replace("%", "").trim());
            if (!isNaN(parsed)) {
              vatPercent = parsed;
              grouped[key].vatRates[parsed + "%"] = true;
            }
          }
          const vatAmount = amountBeforeTax * (vatPercent / 100);
          const amountAfterTax = amountBeforeTax + vatAmount;

          grouped[key].tongTruocThue += amountBeforeTax;
          grouped[key].tongVat += vatAmount;
          grouped[key].tongSauThue += amountAfterTax;

          grouped[key].items.push({
            moTa: sp.moTa,
            dvt: sp.dvt,
            slXK: sp.slXK,
            giaXuat: sp.giaXuat,
            vat: sp.vat,
            amountBeforeTax: amountBeforeTax,
            vatAmount: vatAmount,
            amountAfterTax: amountAfterTax,
            ncc: sp.ncc,
            soHDNhap: sp.soHDNhap,
            ngayNK: sp.ngayNK
          });
        });

        const sortedKeys = Object.keys(grouped).filter(function(key) {
          return key !== "chuarohd" && key.trim() !== "";
        }).sort(function (a, b) {
          const numA = parseInt(a.replace(/\D/g, ''), 10);
          const numB = parseInt(b.replace(/\D/g, ''), 10);
          if (!isNaN(numA) && !isNaN(numB)) {
            return numB - numA;
          }
          return b.localeCompare(a);
        });

        const thongKe = {
          nam: { count: 0, total: 0 },
          quy: {},
          thang: {}
        };

        const sheetYear = document.getElementById('sheetSelect').value || String(new Date().getFullYear());

        sortedKeys.forEach(function (key) {
          const hd = grouped[key];
          const timeInfo = phanTichNgay(hd.ngayXHD) || { thang: "Chưa rõ", nam: Number(sheetYear), quy: "Chưa rõ" };

          thongKe.nam.count++;
          thongKe.nam.total += hd.tongSauThue;

          const qKey = timeInfo.quy === "Chưa rõ" ? "Chưa rõ Quý" : "Quý " + timeInfo.quy;
          if (!thongKe.quy[qKey]) thongKe.quy[qKey] = { count: 0, total: 0 };
          thongKe.quy[qKey].count++;
          thongKe.quy[qKey].total += hd.tongSauThue;

          const mKey = timeInfo.thang === "Chưa rõ" ? "Chưa rõ Tháng" : "Tháng " + timeInfo.thang;
          if (!thongKe.thang[mKey]) thongKe.thang[mKey] = { count: 0, total: 0 };
          thongKe.thang[mKey].count++;
          thongKe.thang[mKey].total += hd.tongSauThue;
        });

        let qHtml = '';
        Object.keys(thongKe.quy).filter(function(q){ return q.indexOf("Chưa rõ") === -1; }).sort().forEach(function(q) {
          qHtml += ' <span style="display:inline-block; margin-right: 15px;">• <b>' + q + ':</b> ' + thongKe.quy[q].count + ' tờ (' + formatSo(thongKe.quy[q].total) + ' VNĐ)</span>';
        });
        if (thongKe.quy["Chưa rõ Quý"]) {
          qHtml += ' <span style="display:inline-block; margin-right: 15px; color:#c5221f;">• <b>Chưa rõ Quý (thiếu Ngày xuất HĐ):</b> ' + thongKe.quy["Chưa rõ Quý"].count + ' tờ (' + formatSo(thongKe.quy["Chưa rõ Quý"].total) + ' VNĐ)</span>';
        }

        let mHtml = '';
        Object.keys(thongKe.thang).filter(function(m){ return m.indexOf("Chưa rõ") === -1; }).sort(function(a, b) {
          return Number(a.replace('Tháng ', '')) - Number(b.replace('Tháng ', ''));
        }).forEach(function(m) {
          mHtml += ' <div style="display:inline-block; width: 45%; margin-bottom: 4px; min-width: 140px;">• <b>' + m + ':</b> ' + thongKe.thang[m].count + ' tờ (' + formatSo(thongKe.thang[m].total) + ' VNĐ)</div>';
        });
        if (thongKe.thang["Chưa rõ Tháng"]) {
          mHtml += ' <div style="display:inline-block; width: 100%; margin-bottom: 4px; color:#c5221f;">• <b>Chưa rõ Tháng (thiếu Ngày xuất HĐ):</b> ' + thongKe.thang["Chưa rõ Tháng"].count + ' tờ (' + formatSo(thongKe.thang["Chưa rõ Tháng"].total) + ' VNĐ)</div>';
        }

                  '<th style="border: 1px solid var(--border); padding: 6px; font-weight: 700;">Nhà cung cấp</th>' +
                  '<th style="border: 1px solid var(--border); padding: 6px; font-weight: 700; text-align: center; width: 80px;">HĐ đầu vào</th>' +

          hd.items.forEach(function (item) {
            itemsHtml += '<tr style="border-bottom: 1px solid #f0f1f5;">' +

          });

          itemsHtml += '</tbody>' +
            '</table>' +

          html += '<div class="invoice-card" onclick="toggleInvoice(\'inv-' + keyIdx + '\')" style="cursor: pointer; position: relative;">' +
            '<div style="font-weight: 800; font-size: 14.5px; color: var(--brand-navy2); margin-bottom: 6px; display: flex; justify-content: space-between; align-items: center;">' +
