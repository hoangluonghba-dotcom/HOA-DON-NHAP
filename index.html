              '<span style="font-size: 12.5px; color: var(--text-muted); font-weight: 500;">📅 ' + hd.ngayXHD + '</span>' +
            '</div>' +
            '<div class="item-row"><span>Xuất cho:</span><span>' + hd.kh + '</span></div>' +
            '<div class="item-row" style="margin-top: 4px;">' +
              '<span>Tiền trước thuế:</span><span>' + formatSo(hd.tongTruocThue) + '</span>' +
            '</div>' +
            '<div class="item-row">' +
              '<span>Thuế suất:</span><span style="color: #b06000;">' + vatRateStr + '</span>' +
            '</div>' +
            '<div class="item-row" style="padding-bottom: 6px; border-bottom: 1px dashed var(--border);">' +
              '<span>Tổng tiền VAT:</span><span>' + formatSo(hd.tongVat) + '</span>' +
            '</div>' +
            '<div class="item-row" style="margin-top: 4px;">' +
              '<span style="font-weight: 700; color: var(--text);">Tổng sau thuế:</span><span style="color: #c5221f; font-size: 15px;">' + formatSo(hd.tongSauThue) + ' VNĐ</span>' +
            '</div>' +
            '<div id="inv-' + keyIdx + '" class="invoice-details" style="display: none; margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border);" onclick="event.stopPropagation();">' +
              '<div style="font-size: 13px; font-weight: 700; margin-bottom: 6px; color: var(--brand-navy2); text-align: left; display: flex; align-items: center; gap: 4px;">' +
                '📊 Bảng chi tiết mặt hàng & đầu vào (NCC):' +
              '</div>' +
              itemsHtml +
            '</div>' +
          '</div>';
        });
      } else {
        // ----- TAB "Còn tồn kho": tính thêm số ngày tồn từ Ngày nhập kho,
        // gắn badge cảnh báo nếu tồn quá lâu (> 1 năm / > 2 năm). Cũng
        // hiển thị badge nếu tồn kho đã được TỰ ĐỘNG khấu trừ do phát
        // hiện lô hàng trùng đã xuất hoá đơn ở 1 năm khác (17/07 #9) -----
        let countTonLau = 0;
        list.forEach(function (sp) {
          const soNgay = tinhSoNgayTuNgay_(sp.ngayNK);
          if (soNgay !== null && soNgay > 365) countTonLau++;
        });

        if (countTonLau > 0) {
          html += '<div class="card" style="background:#fff3e0; border:1px solid #ffd9a6; padding:11px 13px; margin-bottom:10px; cursor:pointer;" onclick="moCanhBaoTonLau()">' +
            '<div style="font-weight:800; color:#b06000; font-size:13.5px;">⏰ Có ' + countTonLau + ' sản phẩm tồn kho quá 1 năm chưa xuất HĐ trong sheet này</div>' +
            '<div style="font-size:12px; color:#8a6100; margin-top:2px;">Bấm để xem chi tiết cảnh báo tồn kho lâu ngày (quét cả 3 năm)</div>' +
          '</div>';
        }

        list.forEach(function (sp, idx) {
          const dangChon = daChon[idx] !== undefined;
          const giaXuatHienTai = dangChon ? daChon[idx].giaXuat : Math.round(Number(sp.giaNhap) * 1.1);
          const tkKhaDung = (sp.tonKhoKhaDung !== undefined && sp.tonKhoKhaDung !== null) ? Number(sp.tonKhoKhaDung) : Number(sp.tonKho);
          const badgeTon = (tkKhaDung < Number(sp.tonKho))
            ? '<span class="badge badge-white">Tồn: ' + sp.tonKho + '</span><span class="badge" style="background:#fff3e0;color:#b06000;">Khả dụng: ' + tkKhaDung + '</span>'
            : '<span class="badge badge-white">Còn tồn: ' + sp.tonKho + '</span>';
          const soNgayTon = tinhSoNgayTuNgay_(sp.ngayNK);
          const badgeTonLau = layBadgeTonLau_(soNgayTon);
          const badgeLienNam = (sp.daXuatONamKhac && Number(sp.daXuatONamKhac) > 0)
            ? '<span class="badge badge-lienam" title="Đã tự động trừ ' + formatSo(sp.daXuatONamKhac) + ' ' + (sp.dvt||'') + ' vì lô hàng này đã được xuất HĐ ở 1 năm khác">🔗 Đã khấu trừ liên năm: -' + formatSo(sp.daXuatONamKhac) + '</span>'
            : '';
          html += '<div class="item">' +
            '<div class="item-title">' + sp.moTa +
              badgeTon +
              (sp.vat ? '<span class="badge badge-vat">VAT ' + sp.vat + '</span>' : '') +
              badgeTonLau +
              badgeLienNam +
            '</div>' +
            '<div class="item-row"><span>NCC</span><span>' + (sp.ncc || '') + '</span></div>' +
            '<div class="item-row"><span>Số HĐ nhập</span><span>' + (sp.soHDNhap || '') + '</span></div>' +
            '<div class="item-row"><span>Ngày nhập</span><span>' + (sp.ngayNK || '') + '</span></div>' +
            '<div class="item-row"><span>Giá nhập</span><span>' + formatSo(sp.giaNhap) + '</span></div>' +
            '<div class="item-row"><span>Tổng tiền HĐ nhập số ' + (sp.soHDNhap || '') + '</span><span>' + formatSo(sp.tongTienHDNhap) + '</span></div>' +
            (badgeLienNam ? '<div class="item-row" style="color:#0f7b3f;"><span>⚠️ Ghi chú tồn kho</span><span>Đã tự trừ vì trùng lô đã bán ở năm khác</span></div>' : '') +
            '<div class="qty-box">' +
              '<label style="margin:0;">SL lấy:</label>' +
              '<input type="number" id="sl-' + idx + '" min="0" max="' + tkKhaDung + '" value="' + (dangChon ? daChon[idx].soLuong : 0) + '" oninput="capNhatSL(' + idx + ', this.value)">' +
              '<span style="font-size:12px;color:var(--text-muted);">/ ' + sp.dvt + '</span>' +
            '</div>' +
          '</div>';
        });
      }
      el.innerHTML = html;
    }

    /**
     * NÂNG CẤP (17/07) #8: hiển thị tab "Chi phí" - liệt kê các mặt hàng
     * có mô tả chứa PHÍ / B.L / CƯỚC (server đã tách riêng sẵn, không còn
     * lẫn trong "Còn tồn kho" / "Đã xuất hoá đơn"). Chỉ hiển thị để tra cứu,
     * KHÔNG cho chọn vào giỏ hàng lập hoá đơn hàng hoá (đúng yêu cầu:
     * tránh nhầm lẫn giữa phí dịch vụ và hàng hoá thật).
     */
    function renderChiPhi_(el) {
      const list = ketQuaHienTai.chiPhi || [];
      if (list.length === 0) {
        el.innerHTML = '<div class="empty-msg"><span class="icon">📭</span>Không có mặt hàng chi phí nào (PHÍ/B.L/CƯỚC) trong sheet này</div>';
        return;
      }

      let html = '<div class="card" style="background:#eef1ff; border:1px solid #d7dcff; padding:11px 13px; margin-bottom:10px;">' +
        '<div style="font-weight:800; color:#3730a3; font-size:13.5px;">ℹ️ Các mặt hàng có mô tả chứa "PHÍ" / "B/L" / "CƯỚC"</div>' +
        '<div style="font-size:12px; color:#4b4f8a; margin-top:2px;">Đây là phí/dịch vụ đi kèm lô hàng (không phải hàng hoá), được tách riêng để không lẫn vào thống kê tồn kho / doanh thu hàng hoá.</div>' +
      '</div>';

      list.forEach(function (sp) {
        const daXuat = sp.soHDXK && /\d+/.test(String(sp.soHDXK)) && String(sp.soHDXK).indexOf('Chưa rõ') === -1;
        html += '<div class="item">' +
          '<div class="item-title">' + sp.moTa +
            '<span class="badge badge-chiphi">Chi phí</span>' +
            (sp.vat ? '<span class="badge badge-vat">VAT ' + sp.vat + '</span>' : '') +
            (daXuat ? '<span class="badge badge-done">Đã xuất HĐ</span>' : '<span class="badge badge-white">Chưa xuất HĐ</span>') +
          '</div>' +
          '<div class="item-row"><span>NCC</span><span>' + (sp.ncc || '') + '</span></div>' +
          '<div class="item-row"><span>Số HĐ nhập</span><span>' + (sp.soHDNhap || '') + '</span></div>' +
          '<div class="item-row"><span>Ngày nhập</span><span>' + (sp.ngayNK || '') + '</span></div>' +
          (daXuat ? (
            '<div class="item-row"><span>Xuất cho (KH)</span><span>' + (sp.kh || '') + '</span></div>' +
            '<div class="item-row"><span>Số HĐ xuất</span><span>' + (sp.soHDXK || '') + '</span></div>' +
            '<div class="item-row"><span>Ngày xuất</span><span>' + (sp.ngayXHD || '') + '</span></div>' +
            '<div class="item-row"><span>Giá xuất</span><span>' + formatSo(sp.giaXuat) + '</span></div>'
          ) : (
            '<div class="item-row"><span>Giá nhập</span><span>' + formatSo(sp.giaNhap) + '</span></div>'
          )) +
        '</div>';
      });

      el.innerHTML = html;
    }

    function phanTichNgay(ngayStr) {
      if (!ngayStr || ngayStr === "Chưa rõ") return null;
      const parts = String(ngayStr).split('/');
      if (parts.length === 3) {
        const thang = parseInt(parts[1], 10);
        const nam = parseInt(parts[2], 10);
        if (!isNaN(thang) && !isNaN(nam)) {
          return { thang: thang, nam: nam, quy: Math.ceil(thang / 3) };
        }
      }
      const d = new Date(ngayStr);
      if (!isNaN(d.getTime())) {
        const thang = d.getMonth() + 1;
        return { thang: thang, nam: d.getFullYear(), quy: Math.ceil(thang / 3) };
      }
      return null;
    }

    /**
     * Khi người dùng nhập số lượng trong tab "Còn tồn kho": thêm/cập nhật
     * mặt hàng đó vào giỏ hàng (daChon), mặc định VAT 10% cho mặt hàng mới.
     * NÂNG CẤP: nếu SL nhập vượt tồn kho khả dụng, tự động nhảy về đúng
     * SL tối đa có thể xuất (không chặn cứng, chỉ tự điều chỉnh).
     */
    function capNhatSL(idx, soLuong) {
      let sl = Number(soLuong);
      const sp = ketQuaHienTai.chuaXuat[idx];
      const tonKhoKhaDung = (sp.tonKhoKhaDung !== undefined && sp.tonKhoKhaDung !== null)
        ? Number(sp.tonKhoKhaDung) : Number(sp.tonKho);

      if (sl > tonKhoKhaDung) {
        alert('⚠️ Chỉ còn ' + tonKhoKhaDung + ' ' + sp.dvt + ' KHẢ DỤNG cho mặt hàng này\n' +
              '(đã trừ số đã đặt ở các hoá đơn nháp khác chưa xử lý xong).\n' +
              'Số lượng đã được TỰ ĐỘNG điều chỉnh về tối đa: ' + tonKhoKhaDung + '.');
        sl = tonKhoKhaDung;
        const slInput = document.getElementById('sl-' + idx);
        if (slInput) slInput.value = sl;
      }
      if (sl < 0) {
        sl = 0;
        const slInput = document.getElementById('sl-' + idx);
        if (slInput) slInput.value = sl;
      }

      if (sl > 0) {
        if (!daChon[idx]) {
          // SỬA LỖI (16/07 muộn): KHÔNG được mặc định VAT = 10% cho mọi mặt
          // hàng. Phải lấy ĐÚNG % thuế suất thật của chính mã sản phẩm đó
          // (đã được server tính sẵn ở sp.vat, VD "8%" hoặc "10%"), tuyệt đối
          // không "ghi đại" 1 mức chung.
          const vatRaw = sp.vat;
          if (vatRaw && String(vatRaw).indexOf('?') !== -1) {
            alert('⚠️ KHÔNG XÁC ĐỊNH được chính xác thuế suất VAT của sản phẩm:\n"' + sp.moTa + '"\n' +
              '(giá trị gốc trên sheet: ' + vatRaw + ').\n\n' +
              'Vui lòng kiểm tra lại cột VAT trên sheet dữ liệu gốc trước khi thêm mặt hàng này vào hoá đơn.');
            const slInput = document.getElementById('sl-' + idx);
            if (slInput) slInput.value = 0;
            return;
          }
          const vatSanPham = layVATSo_(vatRaw);

          // NÂNG CẤP: CHẶN GỘP CHUNG NHIỀU MỨC THUẾ SUẤT VAT KHÁC NHAU TRÊN
          // CÙNG 1 HOÁ ĐƠN NHÁP. Mỗi tờ hoá đơn CHỈ được DUY NHẤT 1 mức thuế
          // suất (toàn bộ 8% hoặc toàn bộ 10%), không được vừa 8% vừa 10%.
          // Nếu mặt hàng đang thêm có VAT khác với các mặt hàng đã có sẵn
          // trong giỏ hàng -> CẢNH BÁO NGAY LẬP TỨC và KHÔNG cho thêm vào.
          const xungDot = timXungDotVAT_(vatSanPham, idx);
          if (xungDot) {
            alert('🚫 KHÔNG THỂ THÊM SẢN PHẨM NÀY VÀO HOÁ ĐƠN!\n\n' +
              'Sản phẩm "' + sp.moTa + '" chịu thuế suất VAT ' + vatSanPham + '%,\n' +
              'trong khi hoá đơn nháp hiện tại đang có sản phẩm "' + xungDot.moTa + '" chịu thuế suất ' + xungDot.vatBan + '%.\n\n' +
              '⚠️ Mỗi hoá đơn CHỈ được xuất DUY NHẤT 1 mức thuế suất VAT (toàn bộ 8% hoặc toàn bộ 10%), KHÔNG được gộp chung nhiều mức thuế suất trên cùng 1 tờ hoá đơn.\n\n' +
              'Vui lòng lập RIÊNG 1 hoá đơn khác cho các mặt hàng chịu thuế suất ' + vatSanPham + '%.');
            const slInput = document.getElementById('sl-' + idx);
            if (slInput) slInput.value = 0;
            return;
          }

          const giaXuat = Math.round(Number(sp.giaNhap) * 1.1);
          daChon[idx] = {
            moTa: sp.moTa, dvt: sp.dvt, soLuong: sl, giaXuat: giaXuat, giaNhap: sp.giaNhap,
            vatBan: vatSanPham, tonKho: sp.tonKho, tonKhoKhaDung: tonKhoKhaDung, soHDNhap: sp.soHDNhap, ncc: sp.ncc, ngayNK: sp.ngayNK,
            tongTienHDNhap: sp.tongTienHDNhap, tenSheet: document.getElementById('sheetSelect').value
          };
        } else {
          daChon[idx].soLuong = sl;
          daChon[idx].tonKhoKhaDung = tonKhoKhaDung;
        }
      } else {
        delete daChon[idx];
      }
      capNhatThanhTBar();
    }

    /**
     * Chuyển chuỗi VAT (VD "8%", "10%", "0%", hoặc số) thành số nguyên %.
     * Trả về 0 nếu không đọc được (an toàn, không suy đoán bừa).
     */
    function layVATSo_(vatStr) {
      if (vatStr === null || vatStr === undefined || vatStr === '') return 0;
      const parsed = parseFloat(String(vatStr).replace('%', '').trim());
      return isNaN(parsed) ? 0 : parsed;
    }

    /**
     * KIỂM TRA XUNG ĐỘT THUẾ SUẤT VAT: 1 hoá đơn nháp CHỈ được phép có
     * DUY NHẤT 1 mức thuế suất VAT cho toàn bộ các mặt hàng (không được
     * vừa 8% vừa 10% trên cùng 1 tờ). Trả về mặt hàng đầu tiên trong giỏ
     * hàng có mức VAT KHÁC với vatMoi (nếu có xung đột), hoặc null nếu
     * không có xung đột (giỏ hàng trống hoặc toàn bộ cùng 1 mức thuế suất).
     * boQuaKey (tuỳ chọn): bỏ qua chính dòng đang sửa (khi đổi VAT ngay
     * trên dòng đó trong giỏ hàng), tránh tự so sánh với chính nó.
     */
    function timXungDotVAT_(vatMoi, boQuaKey) {
      const keys = Object.keys(daChon);
      for (let i = 0; i < keys.length; i++) {
        const k = keys[i];
        if (boQuaKey !== undefined && boQuaKey !== null && String(k) === String(boQuaKey)) continue;
        const sp = daChon[k];
        const vatHienCo = (sp.vatBan !== undefined && sp.vatBan !== null) ? Number(sp.vatBan) : 0;
        if (vatHienCo !== Number(vatMoi)) {
          return sp;
        }
      }
      return null;
    }

    /**
     * Vẽ lại khung "Giỏ hàng đã chọn": mỗi dòng có thể sửa SL / giá / VAT
     * hoặc xoá hẳn khỏi giỏ hàng. Đây là nơi DUY NHẤT hiển thị đầy đủ các
     * mặt hàng đang có trong hoá đơn (kể cả các dòng nạp lại khi bấm "Sửa
     * hoá đơn nháp"), khắc phục lỗi trước đây không thể xem/sửa lại.
     */
    function renderGioHang() {
      const panel = document.getElementById('panelGioHang');
      const el = document.getElementById('dsGioHang');
      const keys = Object.keys(daChon);

      document.getElementById('soLuongGioHang').textContent = keys.length;

      if (keys.length === 0) { panel.style.display = 'none'; return; }
      panel.style.display = 'block';

      let html = '';
      keys.forEach(function (k) {
        const sp = daChon[k];
        const vatVal = (sp.vatBan !== undefined && sp.vatBan !== null) ? Number(sp.vatBan) : 0;
        const maxTon = (sp.tonKhoKhaDung !== undefined && sp.tonKhoKhaDung !== null) ? Number(sp.tonKhoKhaDung) : Number(sp.tonKho);
        html += '<div class="cart-row">' +
          '<div class="cart-row-title">' +
            '<span>' + sp.moTa + '</span>' +
            '<span class="x-remove" onclick="xoaKhoiGioHang(\'' + k + '\')">✕</span>' +
          '</div>' +
          '<div class="cart-row-fields">' +
            '<label>SL:</label>' +
            '<input type="number" id="cartsl-' + k + '" min="1" max="' + (isFinite(maxTon) ? maxTon : '') + '" value="' + sp.soLuong + '" style="width:64px;" oninput="suaSLGioHang(\'' + k + '\', this.value)">' +
            '<label>Giá bán:</label>' +
            '<input type="text" value="' + formatSo(sp.giaXuat) + '" style="width:100px;" oninput="suaGiaGioHang(\'' + k + '\', this.value)">' +
            '<label>VAT:</label>' +
            '<select onchange="suaVATGioHang(\'' + k + '\', this.value)" style="width:70px;">' +
              '<option value="0" ' + (vatVal === 0 ? 'selected' : '') + '>0%</option>' +
              '<option value="8" ' + (vatVal === 8 ? 'selected' : '') + '>8%</option>' +
              '<option value="10" ' + (vatVal === 10 ? 'selected' : '') + '>10%</option>' +
            '</select>' +
          '</div>' +
        '</div>';
      });
      el.innerHTML = html;
    }

    function xoaKhoiGioHang(k) {
      delete daChon[k];
      capNhatThanhTBar();
      render(); // cập nhật lại ô SL ở tab "Còn tồn kho" nếu mặt hàng đó nằm trong list hiện tại
    }

    /**
     * NÂNG CẤP: khi sửa số lượng trực tiếp trong "Giỏ hàng đã chọn", nếu
     * người dùng nhập vượt quá tồn kho khả dụng của mặt hàng đó, hệ thống
     * TỰ ĐỘNG nhảy về đúng số lượng tối đa có thể xuất (không cho âm kho),
     * đồng thời cập nhật lại ô input để người dùng thấy ngay giá trị đã
     * được điều chỉnh.
     */
    function suaSLGioHang(k, gt) {
      let sl = Number(gt) || 0;
      if (sl <= 0) { xoaKhoiGioHang(k); return; }

      const sp = daChon[k];
      const maxTon = (sp.tonKhoKhaDung !== undefined && sp.tonKhoKhaDung !== null)
        ? Number(sp.tonKhoKhaDung) : Number(sp.tonKho);

      if (isFinite(maxTon) && sl > maxTon) {
        alert('⚠️ Chỉ còn tối đa ' + maxTon + ' ' + (sp.dvt || '') + ' KHẢ DỤNG cho mặt hàng này.\n' +
              'Số lượng đã được TỰ ĐỘNG điều chỉnh về: ' + maxTon + '.');
        sl = maxTon;
      }

      daChon[k].soLuong = sl;
      capNhatThanhTBar();

      // Đồng bộ lại giá trị hiển thị ở chính ô vừa sửa (phòng khi bị điều chỉnh)
      const cartInput = document.getElementById('cartsl-' + k);
      if (cartInput) cartInput.value = sl;
      // Đồng bộ lại ô SL ở tab "Còn tồn kho" nếu mặt hàng đó đang nằm trong list (key là số idx)
      const slInputTab = document.getElementById('sl-' + k);
      if (slInputTab) slInputTab.value = sl;
    }

    function suaGiaGioHang(k, gt) {
      const gia = Number(String(gt).replace(/\D/g, "")) || 0;
      daChon[k].giaXuat = gia;
      capNhatThanhTBar();
    }

    function suaVATGioHang(k, gt) {
      const vatMoi = Number(gt) || 0;

      // NÂNG CẤP: chặn đổi thuế suất VAT của 1 dòng nếu làm hoá đơn bị
      // GỘP CHUNG nhiều mức thuế suất khác nhau.
      const xungDot = timXungDotVAT_(vatMoi, k);
      if (xungDot) {
        alert('🚫 KHÔNG THỂ đổi thuế suất VAT cho mặt hàng này!\n\n' +
          'Bạn đang chọn thuế suất ' + vatMoi + '%,\n' +
          'trong khi hoá đơn nháp hiện tại đang có sản phẩm "' + xungDot.moTa + '" chịu thuế suất ' + xungDot.vatBan + '%.\n\n' +
          '⚠️ Mỗi hoá đơn CHỈ được xuất DUY NHẤT 1 mức thuế suất VAT, KHÔNG được gộp chung nhiều mức thuế suất trên cùng 1 tờ hoá đơn.');
        renderGioHang(); // vẽ lại để trả dropdown về đúng giá trị cũ
        return;
      }

      daChon[k].vatBan = vatMoi;
      capNhatThanhTBar();
    }

    /**
     * Cập nhật thanh tổng dưới cùng: số lượng sản phẩm đã chọn, tổng tiền
     * trước thuế, tổng tiền VAT, tổng tiền sau thuế. Đồng thời vẽ lại giỏ
     * hàng chi tiết (renderGioHang).
     */
    function capNhatThanhTBar() {
      const keys = Object.keys(daChon);
      const soLuongChonSpan = document.getElementById('soLuongChon');
      if (soLuongChonSpan) soLuongChonSpan.textContent = keys.length;

      let tongTruocThue = 0;
      let tongVAT = 0;
      keys.forEach(function (k) {
        const sp = daChon[k];
        const tt = (Number(sp.soLuong) || 0) * (Number(sp.giaXuat) || 0);
        const vatPercent = (sp.vatBan !== undefined && sp.vatBan !== null) ? Number(sp.vatBan) : 0;
        tongTruocThue += tt;
        tongVAT += tt * (vatPercent / 100);
      });
      const tongSauThue = tongTruocThue + tongVAT;

      document.getElementById('ttTruocThue').textContent = formatSo(tongTruocThue);
      document.getElementById('ttVAT').textContent = formatSo(tongVAT);
      document.getElementById('ttSauThue').textContent = formatSo(tongSauThue);

      document.getElementById('summaryBar').classList.toggle('show', keys.length > 0);
      renderGioHang();
    }

    function taoHoaDon() {
      const tenKH = document.getElementById('tenKH').value.trim();
      if (!tenKH) { alert('Vui lòng nhập tên khách hàng'); return; }
      const danhSach = Object.keys(daChon).map(function (k) { return daChon[k]; });
      if (danhSach.length === 0) { alert('Chưa chọn sản phẩm nào'); return; }

      // CHỐT CHẶN CUỐI CÙNG (phòng dữ liệu cũ/lỗi): đảm bảo TOÀN BỘ hoá đơn
      // chỉ có DUY NHẤT 1 mức thuế suất VAT trước khi gửi lên server.
      const vatSet = {};
      danhSach.forEach(function (sp) { vatSet[Number(sp.vatBan) || 0] = true; });
      const cacMucVAT = Object.keys(vatSet);
      if (cacMucVAT.length > 1) {
        alert('🚫 HOÁ ĐƠN ĐANG BỊ GỘP NHIỀU MỨC THUẾ SUẤT VAT KHÁC NHAU (' + cacMucVAT.join('%, ') + '%)!\n\n' +
          '⚠️ Mỗi hoá đơn CHỈ được xuất DUY NHẤT 1 mức thuế suất (toàn bộ 8% hoặc toàn bộ 10%), KHÔNG được gộp chung.\n\n' +
          'Vui lòng xoá bớt các mặt hàng khác thuế suất trong giỏ hàng, hoặc tách thành nhiều hoá đơn riêng theo từng mức thuế suất.');
        return;
      }

      const btn = document.getElementById('btnTaoHD');
      const originalText = btn.innerHTML;
      btn.disabled = true;
      btn.innerHTML = '⏳ Đang xử lý...';

      const xongHandler = function (kq) {
        btn.disabled = false;
        btn.innerHTML = originalText;

        if (kq.error) { alert('Lỗi: ' + kq.error); return; }

        if (kq.loiTonKho) {
          let msg = '⚠️ KHÔNG THỂ ' + (maHDDangSua ? 'CẬP NHẬT' : 'TẠO') + ' HOÁ ĐƠN - THIẾU TỒN KHO:\n\n';
          kq.loiTonKho.forEach(function (l) {
            msg += '• ' + l.moTa + '\n' +
              '   Tồn kho gốc: ' + formatSo(l.tonKhoGoc) +
              ' | Đã giữ chỗ ở HĐ nháp khác: ' + formatSo(l.daDatO_HDN_khac) +
              ' | Còn lại thực tế: ' + formatSo(l.conLaiThucTe) +
              ' | Bạn yêu cầu: ' + formatSo(l.soLuongYeuCau) + '\n\n';
          });
          alert(msg);
          return;
        }

        // Hiển thị modal xem hoá đơn TẠM để chụp màn hình - KHÔNG lưu Drive,
        // KHÔNG xuất PDF. Đóng modal lại là dữ liệu hiển thị biến mất luôn.
        hienThiHoaDonTamThoi(kq);

        daChon = {};
        maHDDangSua = null;
        document.getElementById('dangSuaBanner').style.display = 'none';
        document.getElementById('tenKH').value = '';
        btn.innerHTML = '✅ Tạo hoá đơn nháp (<span id="soLuongChon">0</span> sản phẩm)';
        capNhatThanhTBar();
        render();
      };

      const loiHandler = function (err) {
        btn.disabled = false;
        btn.innerHTML = originalText;
        alert('Lỗi: ' + err.message);
      };

      if (maHDDangSua) {
        google.script.run.withSuccessHandler(xongHandler).withFailureHandler(loiHandler)
          .capNhatHoaDonNhap(maHDDangSua, tenKH, danhSach);
      } else {
        google.script.run.withSuccessHandler(xongHandler).withFailureHandler(loiHandler)
          .taoHoaDonNhap(tenKH, danhSach);
      }
    }

    /**
     * Hiển thị modal hoá đơn TẠM ngay trên điện thoại (có logo, danh sách
     * mặt hàng dạng BẢNG CÓ KẺ Ô - table-layout: fixed + word-break để chữ
     * LUÔN NẰM GỌN TRONG Ô, tự động xuống dòng khi mô tả dài, không bao giờ
     * tràn ra ngoài hay bị cắt mất chữ) để người dùng chụp màn hình gửi
     * khách. Không gọi server thêm lần nào, không lưu bất kỳ đâu - đóng
     * modal lại là nội dung biến mất hoàn toàn khỏi màn hình.
     */
    function hienThiHoaDonTamThoi(kq) {
      let rows = '';
      let stt = 0;
      (kq.danhSachSanPham || []).forEach(function (sp) {
        stt++;
        const tt = (Number(sp.soLuong) || 0) * (Number(sp.giaXuat) || 0);
        const vatPercent = (sp.vatBan !== undefined && sp.vatBan !== null) ? Number(sp.vatBan) : 0;
        rows += '<tr>' +
          '<td>' + stt + '. ' + sp.moTa + '</td>' +
          '<td class="center">' + (sp.dvt || '') + '</td>' +
          '<td class="so">' + formatSo(sp.soLuong) + '</td>' +
          '<td class="so">' + formatSo(sp.giaXuat) + '</td>' +
          '<td class="center">' + vatPercent + '%</td>' +
          '<td class="so">' + formatSo(tt) + '</td>' +
        '</tr>';
      });

      const logoSrc = document.getElementById('logoNamTien').src;

      document.getElementById('noiDungHoaDonTam').innerHTML =
        '<div style="text-align:center; margin-bottom:12px;">' +
          '<img src="' + logoSrc + '" style="width:56px; height:56px; object-fit:contain;">' +
          '<div style="font-weight:800; font-size:18px; letter-spacing:0.5px; color:var(--brand-navy2); margin-top:8px;">NAM TIẾN</div>' +
          '<div style="font-weight:700; font-size:11px; letter-spacing:1px; text-transform:uppercase; color:var(--brand-orange); margin-top:1px;">Phụ tùng chính hãng</div>' +
          '<div style="font-weight:700; font-size:13.5px; color:var(--text-muted); margin-top:6px;">HOÁ ĐƠN NHÁP (báo giá) - Mã: ' + kq.maHD + '</div>' +
        '</div>' +
        '<div style="font-size:13.5px;"><b>Khách hàng:</b> ' + kq.tenKH + '</div>' +
        '<div style="font-size:13.5px;"><b>Ngày lập:</b> ' + kq.ngayLap + '</div>' +
        '<div class="hd-table-wrap">' +
          '<table class="hd-table">' +
            '<colgroup>' +
              '<col style="width:33%">' +
              '<col style="width:8%">' +
              '<col style="width:9%">' +
              '<col style="width:17%">' +
              '<col style="width:8%">' +
              '<col style="width:25%">' +
            '</colgroup>' +
            '<thead><tr>' +
              '<th>Mô tả sản phẩm</th><th>ĐVT</th><th>SL</th><th>Đơn giá</th><th>VAT</th><th>Thành tiền</th>' +
            '</tr></thead>' +
            '<tbody>' + rows + '</tbody>' +
          '</table>' +
        '</div>' +
        '<div style="margin-top:10px; font-size:13.5px; line-height:1.7;">' +
          '<div style="display:flex;justify-content:space-between;"><span>Tổng tiền trước thuế:</span><b>' + formatSo(kq.tongTruocThue) + '</b></div>' +
          '<div style="display:flex;justify-content:space-between;"><span>Tổng tiền VAT:</span><b style="color:#b06000;">' + formatSo(kq.tongVAT) + '</b></div>' +
          '<div style="display:flex;justify-content:space-between; font-size:16.5px; margin-top:2px;"><span style="font-weight:700;">TỔNG CỘNG:</span><b style="color:#c5221f;">' + formatSo(kq.tongSauThue) + ' VNĐ</b></div>' +
        '</div>' +
        '<div style="font-style:italic; font-size:11px; color:#888; margin-top:12px; text-align:center;">' +
          '(Hoá đơn nháp dùng để báo giá, không thay thế hoá đơn GTGT. Đóng cửa sổ này để ẩn, không lưu trữ.)' +
        '</div>';

      document.getElementById('modalHoaDon').style.display = 'block';
    }

    function dongModalHoaDon() {
      document.getElementById('modalHoaDon').style.display = 'none';
      document.getElementById('noiDungHoaDonTam').innerHTML = ''; // xoá luôn nội dung khỏi bộ nhớ hiển thị
    }

    function moTraCuuHDN() {
      document.getElementById('panelTraCuuHDN').style.display = 'block';
      document.getElementById('panelTonLau').style.display = 'none';
      document.getElementById('panelNibot').style.display = 'none';
      document.getElementById('ketQuaHDN').innerHTML = '';
      document.getElementById('tuKhoaHDN').value = '';
      document.getElementById('tuKhoaHDN').focus();
    }

    function dongTraCuuHDN() {
      document.getElementById('panelTraCuuHDN').style.display = 'none';
    }

    function timKiemHDN() {
      const tk = document.getElementById('tuKhoaHDN').value.trim();
      const el = document.getElementById('ketQuaHDN');
      el.innerHTML = '<div style="text-align:center; color:var(--text-muted); padding:12px;">⏳ Đang tìm...</div>';

      google.script.run.withSuccessHandler(function (kq) {
        if (kq.error) { el.innerHTML = '<div class="empty-msg">⚠️ ' + kq.error + '</div>'; return; }
        const list = kq.danhSach || [];
        if (list.length === 0) { el.innerHTML = '<div class="empty-msg">📭 Không tìm thấy hoá đơn nháp nào</div>'; return; }

        let html = '';
        list.forEach(function (hd) {
          html += '<div style="border:1px solid var(--border); border-radius:10px; padding:10px; margin-bottom:8px; background:#fff;">' +
            '<div style="font-weight:800; color:var(--brand-navy2);">🧾 ' + hd.maHD + '</div>' +
            '<div style="font-size:13px; color:var(--text-muted); margin:4px 0;">' +
              'Khách: <b>' + hd.tenKH + '</b> | Lập: ' + hd.ngayLap + (hd.ngaySua ? ' | Sửa: ' + hd.ngaySua : '') +
            '</div>' +
            '<div style="font-size:13px;">Số dòng: ' + hd.soDong + ' | Tổng tiền: <b style="color:#c5221f;">' + formatSo(hd.tongTien) + ' VNĐ</b></div>' +
            '<button class="btn-primary" style="margin-top:8px;" onclick="suaHoaDonNhap(\'' + hd.maHD + '\')">✏️ Sửa hoá đơn này</button>' +
          '</div>';
        });
        el.innerHTML = html;
      }).withFailureHandler(function (err) {
        el.innerHTML = '<div class="empty-msg">⚠️ Lỗi: ' + err.message + '</div>';
      }).timKiemHoaDonNhap(tk);
    }

    /**
     * ===== CẢNH BÁO TỒN KHO LÂU NGÀY (quét cả 3 sheet năm) =====
     * Đồng bộ dữ liệu của cả 3 sheet ('2026','2025','2024'), gộp toàn bộ
     * sản phẩm "Còn tồn kho" (chưa xuất HĐ, ĐÃ khấu trừ liên năm ở server),
     * tính số ngày đã tồn từ Ngày nhập kho đến hôm nay, lọc những sản phẩm
     * tồn quá 365 ngày (1 năm), sắp xếp tồn lâu nhất lên đầu, để không bị
     * "sót" hàng tồn nhiều năm không xuất hoá đơn.
     */
    function layDuLieuSheetPromise_(tenSheet) {
      return new Promise(function (resolve) {
        google.script.run
          .withSuccessHandler(function (kq) { resolve(kq); })
          .withFailureHandler(function (err) { resolve({ error: err.message }); })
          .dongBoMotSheet(tenSheet, null);
      });
    }

    function moCanhBaoTonLau() {
      document.getElementById('panelTraCuuHDN').style.display = 'none';
      document.getElementById('panelNibot').style.display = 'none';
      document.getElementById('panelTonLau').style.display = 'block';
      quetTonKhoLauNgay_();
      window.scrollTo({ top: document.getElementById('panelTonLau').offsetTop - 10, behavior: 'smooth' });
    }

    function dongCanhBaoTonLau() {
      document.getElementById('panelTonLau').style.display = 'none';
    }

    async function quetTonKhoLauNgay_() {
      const el = document.getElementById('ketQuaTonLau');
      el.innerHTML = '<div style="text-align:center; color:var(--text-muted); padding:14px;">⏳ Đang đồng bộ và quét cả 3 năm (2026, 2025, 2024)...</div>';

      const nam = ['2026', '2025', '2024'];
      let tatCa = [];
      let loiSheet = [];

      for (let i = 0; i < nam.length; i++) {
        const kq = await layDuLieuSheetPromise_(nam[i]);
        if (kq && kq.error) {
          loiSheet.push(nam[i] + ': ' + kq.error);
          continue;
        }
        if (kq && kq.data && kq.data.chuaXuat) {
          kq.data.chuaXuat.forEach(function (sp) {
            const soNgay = tinhSoNgayTuNgay_(sp.ngayNK);
            if (soNgay !== null && soNgay > 365) {
              tatCa.push({
                moTa: sp.moTa, tenSheet: nam[i], ngayNK: sp.ngayNK, soNgay: soNgay,
                tonKho: sp.tonKho, tonKhoKhaDung: (sp.tonKhoKhaDung !== undefined ? sp.tonKhoKhaDung : sp.tonKho),
                ncc: sp.ncc, soHDNhap: sp.soHDNhap, dvt: sp.dvt
              });
            }
          });
        }
      }

      tatCa.sort(function (a, b) { return b.soNgay - a.soNgay; });

      if (tatCa.length === 0) {
        el.innerHTML = (loiSheet.length ? '<div class="empty-msg" style="color:#c5221f;">⚠️ Lỗi khi quét: ' + loiSheet.join(' | ') + '</div>' : '') +
          '<div class="empty-msg"><span class="icon">✅</span>Không có sản phẩm nào tồn kho quá 1 năm chưa xuất hoá đơn. Rất tốt!</div>';
        return;
      }

      let html = '<div style="font-size:13px; font-weight:700; color:#b06000; margin-bottom:10px;">' +
        'Tìm thấy ' + tatCa.length + ' sản phẩm tồn kho quá 1 năm chưa xuất hoá đơn (sắp xếp tồn lâu nhất trước):' +
      '</div>';

      tatCa.forEach(function (it) {
        const critical = it.soNgay > 730;
        html += '<div class="old-stock-row' + (critical ? ' critical' : '') + '">' +
          '<div class="title">' + (critical ? '⚠️' : '⏰') + ' ' + it.moTa + '</div>' +
          '<div class="meta">' +
            '<span>Sheet: <b>' + it.tenSheet + '</b></span>' +
            '<span>Ngày nhập: <b>' + (it.ngayNK || '—') + '</b></span>' +
            '<span>Đã tồn: <b style="color:' + (critical ? '#c5221f' : '#b06000') + ';">' + it.soNgay + ' ngày (~' + (it.soNgay / 365).toFixed(1) + ' năm)</b></span>' +
            '<span>Tồn kho: <b>' + formatSo(it.tonKho) + ' ' + (it.dvt || '') + '</b></span>' +
            '<span>NCC: ' + (it.ncc || '—') + '</span>' +
            '<span>Số HĐ nhập: ' + (it.soHDNhap || '—') + '</span>' +
          '</div>' +
        '</div>';
      });

      if (loiSheet.length) {
        html += '<div class="empty-msg" style="color:#c5221f; padding:10px;">⚠️ Lỗi khi quét: ' + loiSheet.join(' | ') + '</div>';
      }

      el.innerHTML = html;
    }

    /**
     * ===== ĐỐI CHIẾU HOÁ ĐƠN ĐẦU VÀO TỪ NIBOT =====
     * Gọi kiemTraThieuHDDauVaoNIBOT() bên server: đọc trực tiếp Google Sheet
     * NIBOT, so khớp Số HĐ với cột "Số HĐ nhập" của đúng sheet năm tương
     * ứng, liệt kê hoá đơn còn thiếu kèm gợi ý chi tiết mặt hàng (nếu tìm
     * được). Chỉ so khớp theo SỐ HĐ (không so tên NCC) nên đây LÀ CẢNH BÁO
     * để tự kiểm tra, không phải kết luận chắc chắn 100%. Người dùng có
     * thể sửa từng dòng mặt hàng (Mô tả/ĐVT/SL/Giá nhập/VAT) hoặc
     * thêm/xoá dòng trước khi bấm "Xác nhận ghi" - lúc đó mới thực sự ghi
     * vào đúng sheet năm.
     */
    let danhSachThieuNibot = [];

    function moDoiChieuNibot() {
      document.getElementById('panelTraCuuHDN').style.display = 'none';
      document.getElementById('panelTonLau').style.display = 'none';
      document.getElementById('panelNibot').style.display = 'block';
      quetNibot_();
      window.scrollTo({ top: document.getElementById('panelNibot').offsetTop - 10, behavior: 'smooth' });
    }

    function dongDoiChieuNibot() {
      document.getElementById('panelNibot').style.display = 'none';
    }

    function quetNibot_() {
      const el = document.getElementById('ketQuaNibot');
      el.innerHTML = '<div style="text-align:center; color:var(--text-muted); padding:14px;">⏳ Đang đọc NIBOT và đối chiếu với 3 sheet năm...</div>';

      google.script.run.withSuccessHandler(function (kq) {
        if (kq.error) {
          el.innerHTML = '<div class="empty-msg" style="color:#c5221f;">⚠️ Lỗi: ' + kq.error + '</div>';
          return;
        }
        danhSachThieuNibot = kq.danhSachThieu || [];
        renderKetQuaNibot_(kq);
      }).withFailureHandler(function (err) {
        el.innerHTML = '<div class="empty-msg" style="color:#c5221f;">⚠️ Lỗi: ' + err.message + '</div>';
      }).kiemTraThieuHDDauVaoNIBOT();
    }

    function renderKetQuaNibot_(kq) {
      const el = document.getElementById('ketQuaNibot');
      const list = danhSachThieuNibot;

      let thongKeHtml = '<div style="font-size:12.5px; color:var(--text-muted); margin-bottom:8px;">' +
        'Nguồn: <b>' + (kq.tenFileNibot || 'NIBOT') + '</b> | Đọc lúc: ' + kq.ngayDoc + '</div>';

      const tk = kq.thongKeTheoNam || {};
      let tkRows = '';
      Object.keys(tk).forEach(function (nam) {
        tkRows += '<span style="display:inline-block; margin-right:14px;">• <b>' + nam + ':</b> ' +
          tk[nam].tongSoHDNibot + ' HĐ NIBOT, thiếu <b style="color:#c5221f;">' + tk[nam].soThieu + '</b></span>';
      });
      thongKeHtml += '<div class="card" style="background:#eef1ff; border:1px solid #d7dcff; padding:10px 12px; margin-bottom:10px; font-size:12.5px;">' + tkRows + '</div>';

      if (list.length === 0) {
        el.innerHTML = thongKeHtml + '<div class="empty-msg"><span class="icon">✅</span>Không có hoá đơn nào bị thiếu. Đã khớp đầy đủ với NIBOT!</div>';
        return;
      }

      let html = thongKeHtml + '<div style="font-size:13px; font-weight:700; color:#b06000; margin-bottom:10px;">' +
        'Tìm thấy ' + list.length + ' hoá đơn có trong NIBOT nhưng CHƯA có trong Sheet ' +
        '(chỉ so khớp theo Số HĐ - vui lòng kiểm tra kỹ NCC/mặt hàng trước khi ghi):' +
      '</div>';

      list.forEach(function (hd, idx) {
        const rows = hd.dongHang && hd.dongHang.length > 0 ? hd.dongHang : [{ moTa: '', dvt: '', sl: '', giaNhap: '', vat: 8 }];
        hd.dongHang = rows; // đồng bộ lại để themDongNibot_ dùng đúng mảng
        let rowsHtml = '';
        rows.forEach(function (d, ridx) { rowsHtml += renderDongNibot_(idx, ridx, d); });

        html += '<div class="card" id="nibot-card-' + idx + '" style="padding:13px; margin-bottom:10px;">' +
          '<div style="font-weight:800; font-size:14px; color:var(--brand-navy2); margin-bottom:6px;">' +
            '📄 Số HĐ: ' + hd.so + (hd.kyHieu ? ' (KH: ' + hd.kyHieu + ')' : '') +
            ' <span class="badge badge-white">Sheet: ' + hd.namSheet + '</span>' +
          '</div>' +
          '<div style="font-size:12.5px; color:var(--text-muted); margin-bottom:6px;">' +
            'NCC: <b>' + hd.ncc + '</b> | Ngày: ' + hd.ngay + '<br>' +
            'Tiền chưa thuế: ' + formatSo(hd.tienChuaThue) + ' | Tiền thuế: ' + formatSo(hd.tienThue) + ' | Tổng TT: <b>' + formatSo(hd.tienThanhToan) + '</b>' +
          '</div>' +
          '<div id="nibot-rows-' + idx + '">' + rowsHtml + '</div>' +
          '<button class="btn-ghost" style="margin-top:6px;" onclick="themDongNibot_(' + idx + ')">➕ Thêm dòng mặt hàng</button>' +
          '<button class="btn-secondary" style="margin-top:8px;" onclick="xacNhanGhiNibot_(' + idx + ')">✅ Xác nhận ghi vào sheet ' + hd.namSheet + '</button>' +
        '</div>';
      });

      el.innerHTML = html;
    }

    function renderDongNibot_(idx, ridx, d) {
      return '<div class="cart-row" id="nibot-row-' + idx + '-' + ridx + '">' +
        '<div class="cart-row-title">' +
          '<span>Dòng ' + (ridx + 1) + '</span>' +
          '<span class="x-remove" onclick="xoaDongNibot_(' + idx + ',' + ridx + ')">✕</span>' +
        '</div>' +
        '<div class="cart-row-fields">' +
          '<input type="text" placeholder="Mô tả sản phẩm" value="' + (d.moTa || '').replace(/"/g, '&quot;') + '" style="flex:1; min-width:140px;" data-field="moTa">' +
          '<input type="text" placeholder="ĐVT" value="' + (d.dvt || '') + '" style="width:60px;" data-field="dvt">' +
          '<input type="number" placeholder="SL" value="' + (d.sl || '') + '" style="width:70px;" data-field="sl">' +
          '<input type="text" placeholder="Giá nhập" value="' + (d.giaNhap || '') + '" style="width:90px;" data-field="giaNhap">' +
          '<select data-field="vat" style="width:70px;">' +
            '<option value="0" ' + (Number(d.vat) === 0 ? 'selected' : '') + '>0%</option>' +
            '<option value="8" ' + (Number(d.vat) === 8 ? 'selected' : '') + '>8%</option>' +
            '<option value="10" ' + (Number(d.vat) === 10 ? 'selected' : '') + '>10%</option>' +
          '</select>' +
        '</div>' +
      '</div>';
    }

    function themDongNibot_(idx) {
      const hd = danhSachThieuNibot[idx];
      hd.dongHang.push({ moTa: '', dvt: '', sl: '', giaNhap: '', vat: 8 });
      const wrap = document.getElementById('nibot-rows-' + idx);
      wrap.insertAdjacentHTML('beforeend', renderDongNibot_(idx, hd.dongHang.length - 1, hd.dongHang[hd.dongHang.length - 1]));
    }

    function xoaDongNibot_(idx, ridx) {
      const el = document.getElementById('nibot-row-' + idx + '-' + ridx);
      if (el) el.remove();
    }

    function xacNhanGhiNibot_(idx) {
      const hd = danhSachThieuNibot[idx];
      const wrap = document.getElementById('nibot-rows-' + idx);
      const rowDivs = wrap.querySelectorAll('.cart-row');

      const danhSachDong = [];
      rowDivs.forEach(function (rowDiv) {
        const moTa = rowDiv.querySelector('[data-field="moTa"]').value.trim();
        const dvt = rowDiv.querySelector('[data-field="dvt"]').value.trim();
        const sl = Number(rowDiv.querySelector('[data-field="sl"]').value) || 0;
        const giaNhap = Number(String(rowDiv.querySelector('[data-field="giaNhap"]').value).replace(/\D/g, '')) || 0;
        const vat = Number(rowDiv.querySelector('[data-field="vat"]').value) || 0;
        if (moTa && sl > 0) danhSachDong.push({ moTa: moTa, dvt: dvt, sl: sl, giaNhap: giaNhap, vat: vat });
      });

      if (danhSachDong.length === 0) {
        alert('Vui lòng nhập ít nhất 1 dòng hợp lệ (có Mô tả và Số lượng > 0) trước khi xác nhận.');
        return;
      }
      if (!confirm('Xác nhận ghi hoá đơn số ' + hd.so + ' (' + danhSachDong.length + ' dòng) vào sheet ' + hd.namSheet + '?')) return;

      const thongTinHD = {
        namSheet: hd.namSheet, kyHieu: hd.kyHieu, so: hd.so, ncc: hd.ncc, nccGoc: hd.nccGoc,
        ngay: hd.ngay, tienChuaThue: hd.tienChuaThue, tienThue: hd.tienThue, tienThanhToan: hd.tienThanhToan
      };

      google.script.run.withSuccessHandler(function (kq) {
        if (kq.error) { alert('Lỗi: ' + kq.error); return; }
        alert('✅ Đã ghi ' + kq.soDongDaGhi + ' dòng vào sheet ' + kq.namSheet + '.');
        const card = document.getElementById('nibot-card-' + idx);
        if (card) card.remove();
      }).withFailureHandler(function (err) {
        alert('Lỗi: ' + err.message);
      }).ghiHoaDonThieuVaoSheet(thongTinHD, danhSachDong);
    }

    function suaHoaDonNhap(maHD) {
      google.script.run.withSuccessHandler(function (kq) {
        if (kq.error) { alert('Lỗi: ' + kq.error); return; }

        maHDDangSua = kq.maHD;
        document.getElementById('tenKH').value = kq.tenKH;
        document.getElementById('dangSuaBanner').style.display = 'flex';
        document.getElementById('dangSuaText').textContent = 'Đang sửa hoá đơn: ' + kq.maHD;
        document.getElementById('btnTaoHD').innerHTML = '💾 Cập nhật hoá đơn nháp (<span id="soLuongChon">0</span> sản phẩm)';

        daChon = {};
        (kq.danhSachDong || []).forEach(function (dong, i) {
          daChon['edit_' + i] = {
            moTa: dong.moTa, dvt: dong.dvt, soLuong: Number(dong.soLuong), giaXuat: Number(dong.giaXuat),
            vatBan: Number(dong.vatBan) || 0, giaNhap: 0, tonKho: dong.tonKho, soHDNhap: dong.soHDNhap,
            ncc: dong.ncc, ngayNK: dong.ngayNK, tongTienHDNhap: dong.tongTienHDNhap, tenSheet: dong.tenSheet
          };
        });

        dongTraCuuHDN();
        capNhatThanhTBar();

        // CẢNH BÁO NGAY nếu hoá đơn nháp CŨ (lập từ trước) đã bị lỡ gộp
        // nhiều mức thuế suất VAT khác nhau (dữ liệu lỗi từ trước khi có
        // chốt chặn này) - để người dùng biết mà tách lại cho đúng.
        const vatSetCu = {};
        (kq.danhSachDong || []).forEach(function (dong) { vatSetCu[Number(dong.vatBan) || 0] = true; });
        const cacMucVATCu = Object.keys(vatSetCu);
        if (cacMucVATCu.length > 1) {
          alert('🚫 CẢNH BÁO: Hoá đơn nháp "' + kq.maHD + '" ĐANG BỊ GỘP NHIỀU MỨC THUẾ SUẤT VAT KHÁC NHAU (' + cacMucVATCu.join('%, ') + '%)!\n\n' +
            '⚠️ Mỗi hoá đơn CHỈ được xuất DUY NHẤT 1 mức thuế suất (toàn bộ 8% hoặc toàn bộ 10%).\n\n' +
            'Vui lòng xoá bớt các mặt hàng khác thuế suất trong giỏ hàng bên dưới, hoặc tách thành nhiều hoá đơn riêng theo từng mức thuế suất trước khi lưu lại.');
        }

        // Đồng bộ lại sheet đang chọn, LOẠI TRỪ chính hoá đơn đang sửa khỏi
        // phép tính tồn kho khả dụng, để không tự chặn khi muốn tăng SL.
        const tenSheetHienTai = document.getElementById('sheetSelect').value;
        dongBoMotSheetTuServer(tenSheetHienTai, true, false, maHDDangSua);

        window.scrollTo({ top: document.getElementById('panelGioHang').offsetTop - 10, behavior: 'smooth' });
      }).withFailureHandler(function (err) {
        alert('Lỗi: ' + err.message);
      }).layChiTietHoaDonNhap(maHD);
    }

    function huySua() {
      maHDDangSua = null;
      daChon = {};
      document.getElementById('dangSuaBanner').style.display = 'none';
      document.getElementById('btnTaoHD').innerHTML = '✅ Tạo hoá đơn nháp (<span id="soLuongChon">0</span> sản phẩm)';
      document.getElementById('tenKH').value = '';
      capNhatThanhTBar();

      // Tải lại dữ liệu sheet KHÔNG loại trừ hoá đơn nào nữa (về trạng thái bình thường)
      const tenSheetHienTai = document.getElementById('sheetSelect').value;
      dongBoMotSheetTuServer(tenSheetHienTai, true, false);
    }

    function doiChieuGmail() {
      const tenSheet = document.getElementById('sheetSelect').value;
      const el = document.getElementById('ketQua');
      const year = tenSheet.replace(/\D/g, "");
      el.innerHTML = SKELETON_HTML;

      google.script.run.withSuccessHandler(function (kq) {
        if (kq.error) {
          el.innerHTML = '<div class="empty-msg"><span class="icon">⚠️</span>Lỗi: ' + kq.error + '</div>';
          return;
        }

        const list = kq.gmailInvoices || [];
        if (list.length === 0) {
          el.innerHTML = '<div style="margin-bottom: 12px; display: flex; gap: 8px;">' +
            '<button class="btn-ghost" onclick="render()" style="width: auto; flex: 1;">' +
              '⬅ Quay lại HĐ đầu vào' +
            '</button>' +
          '</div>' +
          '<div class="empty-msg"><span class="icon">📭</span>Không tìm thấy email hoá đơn nào trong Gmail của năm ' + year + '</div>';
          return;
        }

        let chuaNhapHtml = '';
        let daNhapHtml = '';
        let countChuaNhap = 0;
        let countDaNhap = 0;

        list.forEach(function (inv) {
          const invCard = '<div style="display: flex; justify-content: space-between; font-size: 13px; background: #fff; border: 1px solid var(--border); padding: 9px 11px; border-radius: 8px; margin-bottom: 6px; flex-wrap: wrap; gap: 6px; text-align: left;">' +
            '<div>' +
              '🏢 <b>' + inv.ncc + '</b><br>' +
              '<span style="color:var(--text-muted);">Số HĐ: ' + inv.soHD + ' | Ngày: ' + (inv.ngay || '—') + '</span>' +
            '</div>' +
            '<div style="align-self: center;">' +
              (inv.daNhap ?
                '<span class="badge" style="background:#e6f4ea; color:#137333; margin-left: 0;">Đã vào Sheet</span>' :
                '<span class="badge" style="background:#fce8e6; color:#c5221f; margin-left: 0;">⚠️ CHƯA VÀO SHEET</span>'
              ) +
            '</div>' +
          '</div>';

          if (inv.daNhap) {
            daNhapHtml += invCard;
            countDaNhap++;
          } else {
            chuaNhapHtml += invCard;
            countChuaNhap++;
          }
        });

        let reportHtml = '<div style="margin-bottom: 12px; display: flex; gap: 8px;">' +
          '<button class="btn-ghost" onclick="render()" style="width: auto; flex: 1;">' +
            '⬅ Quay lại HĐ đầu vào' +
          '</button>' +
        '</div>' +
        '<div class="card" style="background: #fdeeec; border: 1px solid #f5c2c7;">' +
          '<div style="font-weight:800; color:#c5221f; font-size:14px; margin-bottom: 8px;">' +
            '⚠️ CẢNH BÁO: CHƯA VÀO SHEET (' + countChuaNhap + ' hoá đơn)' +
          '</div>' +
          (chuaNhapHtml || '<div style="font-size:13px; color:var(--text-muted);">Tất cả hóa đơn trong Gmail đã được nhập đầy đủ vào Sheet! 🎉</div>') +
        '</div>' +
        '<div class="card" style="background: #eaf7ee; border: 1px solid #c3e6cb;">' +
          '<div style="font-weight:800; color:#137333; font-size:14px; margin-bottom: 8px;">' +
            '✅ ĐÃ VÀO SHEET (' + countDaNhap + ' hoá đơn)' +
          '</div>' +
          daNhapHtml +
        '</div>';

        el.innerHTML = reportHtml;
      }).withFailureHandler(function (err) {
        el.innerHTML = '<div class="empty-msg"><span class="icon">⚠️</span>Lỗi: ' + err.message + '</div>';
      }).doiChieuGmail(tenSheet);
    }

    function toggleInvoice(id) {
      const el = document.getElementById(id);
      if (el) {
        el.style.display = (el.style.display === 'none' || el.style.display === '') ? 'block' : 'none';
      }
    }

    function formatSo(n) {
      if (!n) return '0';
      return Math.round(Number(n)).toLocaleString('vi-VN');
    }
  </script>
</body>
</html>
